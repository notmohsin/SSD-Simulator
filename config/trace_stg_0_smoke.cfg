# Short validation replay for Traces/stg_0.txt (first 1000 I/Os).
# Byte offset/length — see comments in trace_stg_0.cfg.
# Example:
#   ./simplessd-standalone config/trace_stg_0_smoke.cfg config/ssd_trace_replay.cfg out_smoke

[global]
Mode = 1
LogPeriod = 0
LogFile = sim_stats.log
DebugLogFile =
LatencyLogFile =
ProgressPeriod = 0
Interface = 1
Scheduler = 0
SubmissionLatency = 5us
CompletionLatency = 5us

[trace]
File = ./Traces/stg_0.txt
TimingMode = 0
QueueDepth = 32
IOLimit = 1000
Regex = "[0-9]+,[0-9]+ +[0-9]+ +[0-9]+ +([0-9]+)[.]([0-9]+) +[0-9]+ +D +([A-Za-z]+) +([0-9]+) [+] ([0-9]+).*"
Operation = 3
ByteOffset = 4
ByteLength = 5
LBAOffset =
LBALength =
Second = 1
Millisecond =
Microsecond =
Nanosecond = 2
Picosecond =
LBASize = 512
UseHexadecimal = 0